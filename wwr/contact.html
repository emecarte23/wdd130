<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for inquiries, reservations, or feedback. We are here to help you plan your next river adventure.">
    <meta name="author" content="Errol Mecarte">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.jpg" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-header-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street, Kolob, California</p>
            <p>Phone: +1 999 999 9999 | Email: info@whitewater.com</p>
        </section>

        <section class="contact-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.215132007817!2d-73.98509668459377!3d40.75889497932681!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25855c6480299%3A0x55194ec5a1ae072e!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1641321234567!5m2!1sen!2sus"
                  width="600" height="450" loading="lazy"></iframe>
            </div>

            <div class="form-container">
                <h2>Get in Touch!</h2>
                <form action="#">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com"
                          required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label>
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="How can we help?"></textarea>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Team member 1">
                    <figcaption>Alex Rivera - Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Team member 2">
                    <figcaption>Sarah Chen - Safety Lead</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Team member 3">
                    <figcaption>Mike Johnson - Reservations</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Errol Mecarte</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook-icon.png" alt="Facebook"></a>
            <a href="#"><img src="images/linkedin-icon.png" alt="LinkedIn"></a>
            <a href="#"><img src="images/instagram-icon.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
